    [data-theme="dark"] {

      --panel-bg: #1e1e21;
      --card-bg: #242428;
      --text: #eae8e3;
      --text-muted: #9a9892;
      --border: #323237;
      --accent: #63b3ed;
      --accent-soft: #1e3246;
      --wikilink-bg: #1c3147;
      --wikilink-text: #7cc4fa;
      --wikilink-border: #2d4e70;
      --callout-tip-bg: #162c22;
      --callout-tip-border: #48bb78;
      --callout-warn-bg: #302412;
      --callout-warn-border: #ecc94b;
      --code-bg: #1c1c1f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 300px 1fr 330px;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Left Sidebar: Vault Explorer */
    .left-sidebar {
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .brand-bar {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
    }
    .icon-btn:hover { border-color: var(--accent); }

    .search-box {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 8px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13.5px;
    }
    .search-input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px 24px;
    }
    .folder-group { margin-bottom: 14px; }
    .folder-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 6px 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .folder-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .note-link {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13.5px;
      color: var(--text);
      cursor: pointer;
      line-height: 1.35;
      margin-bottom: 2px;
      transition: background 0.12s;
    }
    .note-link:hover { background: var(--accent-soft); }
    .note-link.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    .note-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Center Column: Note Reader */
    .center-pane {
      height: 100vh;
      overflow-y: auto;
      padding: 36px 52px 90px;
    }
    .center-inner {
      max-width: 780px;
      margin: 0 auto;
    }
    .breadcrumbs {
      font-size: 12.5px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .tag-pill {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 12px;
      font-family: var(--font-mono);
    }

    /* Markdown Styling */
    .note-content h1 { font-size: 29px; font-weight: 700; margin-bottom: 16px; line-height: 1.25; }
    .note-content h2 { font-size: 20px; font-weight: 700; margin: 30px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .note-content h3 { font-size: 16.5px; font-weight: 700; margin: 22px 0 8px; }
    .note-content p { font-size: 15.5px; line-height: 1.7; margin-bottom: 14px; }
    .note-content ul, .note-content ol { padding-left: 22px; margin-bottom: 16px; }
    .note-content li { font-size: 15px; line-height: 1.65; margin-bottom: 6px; }
    .note-content hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
    .note-content code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
    }
    .note-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 14px 0 18px;
    }
    .note-content pre code { padding: 0; background: none; }

    /* Tables */
    .note-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 24px;
      font-size: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .note-content th, .note-content td {
      padding: 10px 13px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      line-height: 1.5;
      vertical-align: top;
    }
    .note-content th {
      background: var(--panel-bg);
      font-weight: 700;
      font-size: 13px;
    }

    /* Callouts */
    .callout-box {
      background: var(--callout-tip-bg);
      border-left: 4px solid var(--callout-tip-border);
      padding: 14px 18px;
      border-radius: 6px;
      margin: 16px 0 22px;
      font-size: 14.5px;
      line-height: 1.6;
    }
    .callout-box.warn {
      background: var(--callout-warn-bg);
      border-left-color: var(--callout-warn-border);
    }

    /* Interactive [[Wikilinks]] */
    .wikilink {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--wikilink-bg);
      color: var(--wikilink-text);
      border: 1px solid var(--wikilink-border);
      padding: 1px 7px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 0.94em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.12s ease;

    .wikilink:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

      flex-direction: column;

      overflow-y: auto;
      padding: 16px;
      gap: 18px;

      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;

    .panel-header {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;

      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      height: 250px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: grab;
      display: block;
    }
    #graph-canvas:active { cursor: grabbing; }

    .backlink-item {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 7px;
      cursor: pointer;
      background: var(--bg);
      transition: border-color 0.12s;
    }
    .backlink-item:hover { border-color: var(--accent); }
    .backlink-title { font-size: 13px; font-weight: 700; color: var(--accent); }
    .backlink-preview { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }

    /* Hover Preview Popover (Quartz 4 Style) */
    #hover-popover {
      position: fixed;
      z-index: 2000;
      width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      pointer-events: none;
      display: none;
    }
    .pop-id { font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 700; }
    .pop-title { font-size: 15px; font-weight: 700; margin: 3px 0 6px; color: var(--text); }
    .pop-body { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

    /* Fullscreen Graph Modal */
    #graph-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 18, 0.85);
      z-index: 1500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    #graph-modal.open { display: flex; }
    .modal-inner {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-bar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #modal-canvas {
      flex: 1;
      width: 100%;
      background: var(--bg);
      cursor: grab;
    }

    .mermaid-box {
      background: var(--card-bg);

      border-radius: 8px;
      padding: 18px;
      margin: 16px 0;
      overflow-x: auto;
      display: flex;
      justify-content: center;
    }
  </style>

gy-Disambiguation-Matrix]] — Untangles overloaded words (`adapter`, `harness`, `model`, `skill`)\n- [[00.02-Architecture-Overview-MOC]] — How our 4 AI apps and 2 machines fit together\n\n### `10-Harnesses-and-Agents` — The Apps We Talk To\n- [[10.01-Agent-Harness]] — What an \"agent app\" actually does (vs. a raw AI model)\n- [[10.02-Antigravity-AGY]] — Google Antigravity IDE (our 1M–2M token big-picture planner)\n- [[10.03-Codex-CLI-and-Spark]] — OpenAI Codex (`Sol`/`Terra` + fast `Spark` side-checks)\n- [[10.04-Hermes-Agent]] — Nous Research Hermes Agent (runs local models, MoA councils, and Kanban boards)\n- [[10.05-OpenCode-and-Maestri]] — Offline local coding (`OpenCode`) and multi-pane visual canvas (`Maestri`)\n\n### `20-Models-and-Weights` — The AI Brains & Voice Tuning\n- [[20.01-Base-Model]] — The raw foundation models we run locally and in the cloud\n- [[20.02-LoRA-Weight-Adapter]] — Our custom-trained \"voice & habit packs\" (`v2` and `v3`) layered onto `Qwen3.5-9B`\n- [[20.03-Inference-Provider]] — The local model servers (**oMLX** and **Ollama**) that keep models loaded in RAM/VRAM\n\n### `30-Infrastructure-and-Hosts` — The Machines & Storage Rules\n- [[30.01-Host-Topology-MOC]] — Which machine does what (`workstation-mac` vs. `gpu-server`)\n- [[30.02-Homelab-LLM-Orchestration]] — How local and server GPUs share heavy AI workloads\n- [[30.03-EServ-Filesystem-and-Mounts]] — Keeping hard drives organized so caches never fill up the OS disk\n- [[30.04-Zoom-and-Proxyman-Findings]] — Reading macOS app UI trees cleanly without stealing window focus\n- [[30.05-Emac-Filesystem-and-Home-Layout]] — How we reclaimed +333 GB and organized `~/Projects/` vs. `~/Documents/`\n- [[30.06-EServ-Docker-Containers-and-Services]] — Self-hosted Docker services and auto-recovery on `gpu-server`\n\n### `40-Capabilities-and-Policy` — Rules, Skills, Memory & Safety Net\n- [[40.01-Agent-Policy]] — Our single `WORKSTYLE.md` rulebook that stops bots from looping or asking 20 questions\n- [[40.02-Policy-Sync-Target]] — How `sync_policy.py` copies that one rulebook into 6 different AI apps automatically\n- [[40.03-Agent-Skill]] — Plug-and-play `SKILL.md` mini-playbooks shared across all our agents\n- [[40.04-Session-Ingestor]] — Combining 794 past chats from 9 different AI apps into one searchable memory store\n- [[40.05-TouchID-Redaction-Vault]] — How `vault.py` strips 657 API keys out of chat logs and locks them behind macOS TouchID\n- [[40.06-ANE-Hybrid-Inference-and-Retrieval]] — Sub-second local search (`ane-search`) using Apple Silicon hardware\n\n### `50-Audits-and-Benchmarks` — Crash Tests, Receipts & Bug Hunts\n- [[50.01-Evaluation-Harness]] — Our automated crash-test suites (`H01–H06` and `T01–T15`)\n- [[50.02-2026-10-19-Session-Review-and-Quota-Audit]] — How we discovered the \"88.8% maintenance sinkhole\" and fixed quota lockouts\n- [[50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough]] — How we fixed 4 major AI bugs at both the prompt level and model-weight level\n- [[50.04-2026-10-14-Hermes-Living-Research-Register]] — 5 open experiments (`HAI-001` to `HAI-005`) for testing agent reliability\n- [[50.05-2026-09-26-Hermes-JSON-Double-Encoding-Postmortem]] — Why CLI config commands broke JSON and how our Python deep-merge fixed it\n- [[50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis]] — Doubling local model speed on Apple Silicon by fixing 4 hidden bottlenecks\n- [[50.07-2026-10-20-ANE-Retrieval-Harness-and-Contention-Audit]] — Proving word-match search (BM25) + meaning search (RRF) beats embeddings alone", "preview": "Welcome to the Johnny.Decimal + Zettelkasten ( wikilink ) knowledge vault. Every note here represents a real piece of our working multi agent setup—rewritten into direct, plain English with zero private credentials or personal paths. Where to Start (Especially...", "outgoing": ["70.01-Intelligence-Fit-to-Form-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "70.02-Sycophancy-vs-Reflexive-Contrarianism", "40.01-Agent-Policy", "20.02-LoRA-Weight-Adapter", "70.03-Why-Agent-Browsers-Fail-Comet-vs-Harnesses", "50.01-Evaluation-Harness", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.04-Hermes-Agent", "10.05-OpenCode-and-Maestri", "20.01-Base-Model", "20.03-Inference-Provider", "30.01-Host-Topology-MOC", "30.02-Homelab-LLM-Orchestration", "30.03-EServ-Filesystem-and-Mounts", "30.04-Zoom-and-Proxyman-Findings", "30.05-Emac-Filesystem-and-Home-Layout", "30.06-EServ-Docker-Containers-and-Services", "40.02-Policy-Sync-Target", "40.03-Agent-Skill", "40.04-Session-Ingestor", "40.05-TouchID-Redaction-Vault", "40.06-ANE-Hybrid-Inference-and-Retrieval", "50.04-2026-10-14-Hermes-Living-Research-Register", "50.05-2026-09-26-Hermes-JSON-Double-Encoding-Postmortem", "50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis", "50.07-2026-10-20-ANE-Retrieval-Harness-and-Contention-Audit"], "backlinks": []}, "00.01-Terminology-Disambiguation-Matrix": {"slug": "00.01-Terminology-Disambiguation-Matrix", "id": "00.01", "title": "Plain-English Dictionary (Untangling Overloaded Words)", "folder": "00-Glossary-and-Index", "domain": "glossary", "type": "concept", "tags": ["taxonomy", "glossary", "disambiguation"], "aliases": ["glossary", "terminology", "disambiguation", "adapter vs harness"], "updated": "2026-10-28", "body": "# Plain-English Dictionary (Untangling Overloaded Words)\n\n> [!TIP]\n> **Why This Page Exists**: In AI projects, people say **\"adapter\"**, **\"harness\"**, **\"model\"**, and **\"skill\"** to mean five different things. This page gives each piece of our setup one clear name so we never talk past each other.\n\n---\n\n## 1. Three Things That Used to Be Called \"Adapter\"\n\nWhy \"adapter\" was confusing: three totally unrelated scripts in our repos used the word \"adapter\":\n\n| Casual Word | What You're Actually Talking About | Clear Name & Link | What It Does in Plain English |\n|---|---|---|---|\n| *\"Model adapter\"* / *\"LoRA\"* | Fine-tuning on the GPU server (`v2`/`v3`, `Qwen3.5-9B`) | **[[20.02-LoRA-Weight-Adapter]]** | A small \"personality & habit pack\" layered on top of a [[20.01-Base-Model]] so it follows tool rules without retraining the whole brain. |\n| *\"Policy adapter\"* / *\"Rules file\"* | `WORKSTYLE.md`, `sync_policy.py`, `AGENTS.md`, `SOUL.md` | **[[40.02-Policy-Sync-Target]]** | The instruction file inside each AI app (`AGENTS.md` or `SOUL.md`) that receives our shared rules automatically. |\n| *\"Session adapter\"* / *\"Ingestor\"* | `unify_sessions.py`, chat logs from 9 apps | **[[40.04-Session-Ingestor]]** | A converter script that reads chat histories from 9 different AI apps and saves them in one clean format. |\n\n---\n\n## 2. Two Things Called \"Harness\"\n\n| Clear Name | Note | What It Does in Plain English | Examples |\n|---|---|---|---|\n| **Agent Harness** *(The App)* | [[10.01-Agent-Harness]] | The **app or CLI you actually type into**. It wraps around an AI model, gives it tools (like reading files or running terminal commands), and shows you the chat. | [[10.02-Antigravity-AGY]], [[10.03-Codex-CLI-and-Spark]], [[10.04-Hermes-Agent]], [[10.05-OpenCode-and-Maestri]] |\n| **Evaluation Harness** *(The Crash Test)* | [[50.01-Evaluation-Harness]] | An **automated test script** that throws 15–110 tricky questions at an AI to see where it breaks or loops. | `run_lora_holdout_eval.py` (`T01–T15`), Hermes Workflow Suite (`H01–H06`) |\n\n```mermaid\nflowchart LR\n    User([\"👤 You / Ryan\"]) --> AH[\"🤝 Agent Harness (App)<br/>(Antigravity, Codex, Hermes, OpenCode)\"]\n    AH -- \"Always Loads\" --> PST[\"📜 Policy Sync Target<br/>(WORKSTYLE.md Rules)\"]\n    AH -- \"Loads When Needed\" --> Skill[\"🧰 Agent Skill<br/>(SKILL.md Playbook)\"]\n    AH -- \"Talks To\" --> IP[\"⚡ Inference Provider<br/>(oMLX / Ollama / Cloud)\"]\n    IP -- \"Runs\" --> BM[\"🧠 Base Model<br/>(Qwen3.5-9B, Gemini 4, GPT-6)\"]\n    BM -- \"Tuned By\" --> LoRA[\"🎭 LoRA Weight Adapter<br/>(v2 / v3 Habit Pack)\"]\n    AH -- \"Saves Chats To\" --> SI[\"🗂️ Session Ingestor<br/>(unify_sessions.py)\"]\n```\n\n---\n\n## 3. The Brain Layer: Model vs. Adapter vs. Server\n\n| Clear Name | Note | Plain-English Role | Examples in Our Setup |\n|---|---|---|---|\n| **Base Model** | [[20.01-Base-Model]] | The raw AI brain files sitting on the hard drive. | `Qwen3.5-9B`, `S1-mini-MLX`, `Gemini 4`, `GPT-6` |\n| **LoRA Weight Adapter** | [[20.02-LoRA-Weight-Adapter]] | A tiny add-on file trained to fix bad habits (like searching 6 times in a row when a file is missing). | `qwen3.5-9b-hermes-lora-v2`, `qwen3.5-9b-hermes-lora-v3` |\n| **Inference Provider** | [[20.03-Inference-Provider]] | The background server app that loads the Base Model into RAM and answers requests. | **oMLX** (on `workstation-mac`), **Ollama** (on `gpu-server`) |\n\n---\n\n## 4. Rules vs. Skills vs. Memory (OtterLore)\n\n- **[[40.01-Agent-Policy]] (`WORKSTYLE.md`)**: **Always-on house rules** loaded into every chat (e.g., *\"Don't ask permission for obvious steps\"*, *\"Stop searching after 2 empty tries\"*).\n- **[[40.03-Agent-Skill]] (`SKILL.md`)**: **On-demand how-to guides** that the AI only opens when doing a specific job (like exporting iMessages or building a slide deck).\n- **OtterLore** ([[40.04-Session-Ingestor]] + [[40.06-ANE-Hybrid-Inference-and-Retrieval]]): Our **shared memory search engine** across both hand-written notes (`~/.agents/knowledge/`) and 794 past chat transcripts (`~/.agents/sessions/`), with all API keys locked safely inside [[40.05-TouchID-Redaction-Vault]].", "preview": "Why This Page Exists : In AI projects, people say \"adapter\" , \"harness\" , \"model\" , and \"skill\" to mean five different things. This page gives each piece of our setup one clear name so we never talk past each other. Why \"adapter\" was confusing: three totally u...", "outgoing": ["20.02-LoRA-Weight-Adapter", "20.01-Base-Model", "40.02-Policy-Sync-Target", "40.04-Session-Ingestor", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.04-Hermes-Agent", "10.05-OpenCode-and-Maestri", "50.01-Evaluation-Harness", "20.03-Inference-Provider", "40.01-Agent-Policy", "40.03-Agent-Skill", "40.06-ANE-Hybrid-Inference-and-Retrieval", "40.05-TouchID-Redaction-Vault"], "backlinks": ["00.00-Home-MOC", "10.01-Agent-Harness", "20.02-LoRA-Weight-Adapter", "40.01-Agent-Policy", "40.02-Policy-Sync-Target", "50.01-Evaluation-Harness"]}, "00.02-Architecture-Overview-MOC": {"slug": "00.02-Architecture-Overview-MOC", "id": "00.02", "title": "Architecture Overview MOC (How the Whole System Fits Together)", "folder": "00-Glossary-and-Index", "domain": "glossary", "type": "moc", "tags": ["moc", "architecture"], "aliases": ["architecture", "system map", "tri-agent architecture"], "updated": "2026-10-28", "body": "# Architecture Overview MOC (How the Whole System Fits Together)\n\n> [!TIP]\n> **The Big Picture in One Sentence**: Instead of forcing one AI tool to do everything, we split the work across **two machines** (`workstation-mac` and `gpu-server`) and **four specialized AI apps**, all following **one shared rulebook** ([[40.01-Agent-Policy]]).\n\nSee also [[70.01-Intelligence-Fit-to-Form-MOC]] for how this directly mirrors Ryan's *\"Intelligence Fit to Form\"* philosophy.\n\n```mermaid\nflowchart TD\n    subgraph Hosts [\"30: The Two Machines\"]\n        WMAC[\"💻 workstation-mac (M5 Pro 24GB)<br/>Daily Laptop & Local Apple Silicon\"]\n        GSERV[\"🖥️ gpu-server (RTX 4070 12GB)<br/>24/7 Linux Server & Storage Pool\"]\n    end\n\n    subgraph Harnesses [\"10: The Four AI Apps\"]\n        AGY[\"🚀 Antigravity (AGY)<br/>1M–2M Token Big-Picture Planner\"]\n        CDX[\"🎯 Codex + Spark<br/>Sharp Code & 2-Min Side Checks\"]\n        HRM[\"⚡ Hermes Agent<br/>Local Ops, MoA Councils & Kanban\"]\n        OPC[\"🎨 OpenCode + Maestri<br/>Offline Coding & Visual Canvas\"]\n    end\n\n    subgraph Models [\"20: The AI Brains & Servers\"]\n        OMLX[\"oMLX Server (on workstation-mac)<br/>Qwen3.5-9B / S1-mini (180–300 tok/s)\"]\n        OLLAMA[\"GPU Server Inference (Ollama)<br/>Qwen3.5-9B + Custom LoRA v2/v3\"]\n    end\n\n    subgraph Governance [\"40: Shared Rules & Memory\"]\n        POL[\"📜 WORKSTYLE.md -> Synced to 6 Apps\"]\n        SKL[\"🧰 31 Shared SKILL.md Playbooks\"]\n        SES[\"🗂️ 794 Unified Chats + 657 Keychain Secrets\"]\n        VLT[\"🧠 This [[Wikilink]] Knowledge Vault\"]\n    end\n\n    Governance --> Harnesses\n    AGY --> WMAC\n    CDX --> WMAC\n    HRM --> OMLX\n    HRM --> OLLAMA\n    OPC --> OMLX\n    OMLX --> WMAC\n    OLLAMA --> GSERV\n```\n\n---\n\n## 3 Big Decisions We Made on Oct 19, 2026\n\n1. **Escaping the \"88.8% Maintenance Sinkhole\"** ([[50.02-2026-10-19-Session-Review-and-Quota-Audit]]):\n   - **The Problem**: Between Oct 15 and Oct 19, **88.8%** of our AI usage went into fixing and tweaking the AI tools themselves rather than shipping real projects—while [[10.03-Codex-CLI-and-Spark]] kept hitting 5-hour usage lockouts.\n   - **The Fix**: Give each AI app a clear lane:\n     - **[[10.02-Antigravity-AGY]]** handles huge 1M–2M token planning, multi-file research, and visual portals (since it has 77–82% unused quota).\n     - **[[10.03-Codex-CLI-and-Spark]]** is saved for surgical code reviews and fast 2-minute `spark` second opinions.\n     - **[[10.04-Hermes-Agent]]** runs free local models on our own hardware for daily automation and multi-model councils.\n2. **Fixing Bad AI Habits in Two Places at Once** ([[50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough]]):\n   - When an AI gets stuck in a blind search loop (`H05`) or writes broken tool tags (`T02`), we fix it twice:\n     1. **In the written rules** ([[40.01-Agent-Policy]]: *\"Stop after 2 empty searches and tell the user\"*).\n     2. **In the model's trained weights** ([[20.02-LoRA-Weight-Adapter]] `v3`: fine-tuning examples where the model stops cleanly after 1 empty search).\n   - See [[70.02-Sycophancy-vs-Reflexive-Contrarianism]] for why combining prompt rules with weight tuning solves the exact behavioral drift Ryan writes about.\n3. **One Shared Memory & Rulebook Across Every App**:\n   - **One Rulebook**: `~/.config/agent-policy/WORKSTYLE.md` ([[40.01-Agent-Policy]]) automatically copies itself into 6 [[40.02-Policy-Sync-Target]] files.\n   - **One Skill Folder**: `~/.agents/skills/` shares 31 [[40.03-Agent-Skill]] playbooks with every app.\n   - **One Chat Archive**: `unify_sessions.py` collects 794 chats from 9 apps ([[40.04-Session-Ingestor]]) and strips secrets into macOS TouchID Keychain ([[40.05-TouchID-Redaction-Vault]]).", "preview": "The Big Picture in One Sentence : Instead of forcing one AI tool to do everything, we split the work across two machines ( workstation mac and gpu server ) and four specialized AI apps , all following one shared rulebook (40.01 Agent Policy). See also 70.01 In...", "outgoing": ["40.01-Agent-Policy", "70.01-Intelligence-Fit-to-Form-MOC", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "10.03-Codex-CLI-and-Spark", "10.02-Antigravity-AGY", "10.04-Hermes-Agent", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "20.02-LoRA-Weight-Adapter", "70.02-Sycophancy-vs-Reflexive-Contrarianism", "40.02-Policy-Sync-Target", "40.03-Agent-Skill", "40.04-Session-Ingestor", "40.05-TouchID-Redaction-Vault"], "backlinks": ["00.00-Home-MOC", "10.02-Antigravity-AGY", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "70.01-Intelligence-Fit-to-Form-MOC"]}, "10.01-Agent-Harness": {"slug": "10.01-Agent-Harness", "id": "10.01", "title": "Agent Harness (The Apps We Talk To)", "folder": "10-Harnesses-and-Agents", "domain": "harnesses", "type": "concept", "tags": ["taxonomy", "harness"], "aliases": ["harness", "agent harness", "client harness", "agent app"], "updated": "2026-10-28", "body": "# Agent Harness (The Apps We Talk To)\n\n## What It Is in Plain English\n\nAn **Agent Harness** is the **app, CLI, or code editor you actually type into**. A raw [[20.01-Base-Model]] is just a brain in a jar—it can only predict text. The **Agent Harness** gives that brain hands and eyes by doing three things:\n1. **Builds the Prompt**: Combines your message with our always-on house rules ([[40.01-Agent-Policy]]) and any relevant how-to playbooks ([[40.03-Agent-Skill]]).\n2. **Runs Tools**: Watches for `<tool_call>` tags from the model, runs terminal commands or reads files safely, and feeds the results back to the model.\n3. **Saves the Chat**: Writes the conversation log to disk so [[40.04-Session-Ingestor]] can add it to our searchable memory.\n\n> [!WARNING]\n> **Quick Name Check** (see [[00.01-Terminology-Disambiguation-Matrix]]):\n> - **Agent Harness** = the interactive app (`Antigravity`, `Codex`, `Hermes`, `OpenCode`).\n> - **[[50.01-Evaluation-Harness]]** = the automated crash-test script (`run_lora_holdout_eval.py`).\n> - **[[40.02-Policy-Sync-Target]]** = the rules file (`AGENTS.md` / `SOUL.md`) inside each app.\n\n---\n\n## Our 4 Active Agent Harnesses (\"Intelligence Fit to Form\")\n\nSee [[70.01-Intelligence-Fit-to-Form-MOC]] for why we split work across specialized apps instead of using one tool for everything:\n\n| Agent Harness | Note | What Brain It Uses | Best Job for This App | Where Its Rules Live |\n|---|---|---|---|---|\n| **Antigravity (AGY)** | [[10.02-Antigravity-AGY]] | Gemini 4 / Gemini 3.8 / Claude | Huge 1M–2M token projects, multi-file planning, visual UIs, and deep research | `~/.gemini/config/rules/AGENTS.md` |\n| **Codex + Spark** | [[10.03-Codex-CLI-and-Spark]] | GPT-6 (`Sol` / `Terra` / `Luna`) + `Spark` | Surgical code changes, bug-hunting reviews, and 2-minute `spark` sanity checks | `~/.codex/AGENTS.md` |\n| **Hermes Agent** | [[10.04-Hermes-Agent]] | Local [[20.03-Inference-Provider]] (oMLX / Ollama `Qwen3.5-9B` + [[20.02-LoRA-Weight-Adapter]]) | 02-Architecture-Overview-MOC]]), Antigravity is the **heavy-duty architect, deep researcher, and visual builder**.\n\n## How It Connects to the Rest of the Vault\n\n- **App Data Folder**: `~/.gemini/antigravity/`\n- **Chat Transcripts**: `~/.gemini/antigravity/brain/<conversation-id>/`\n  - Every conversation log (`transcript.jsonl`) is automatically collected and secret-scrubbed by [[40.04-Session-Ingestor]].\n- **Shared House Rules**: `~/.gemini/config/rules/AGENTS.md` (kept in sync with [[40.01-Agent-Policy]] via [[40.02-Policy-Sync-Target]]).\n- **Shared Skills**: `~/.gemini/config/skills/` (linked to our 31 playbooks in [[40.03-Agent-Skill]]).\n\n## Why We Route Heavy Work Here (From Our Oct 19 Quota Audit)\n\nIn [[50.02-2026-10-19-Session-Review-and-Quota-Audit]], we checked usage across all our AI subscriptions:\n- **Plenty of Breathing Room**: While [[10.03-Codex-CLI-and-Spark]] kept hitting 5-hour usage lockouts, Antigravity still had **77% of its Gemini pool**, **82% of its Claude/GPT pool**, and **54% of its Argon pool** untouched.\n- **Our Rule of Thumb**: Whenever a task needs reading 20+ files, organizing notes in this vault, or building a visual app from scratch, we send it to **Antigravity** first so Codex stays free for surgical code reviews.", "preview": "Antigravity (AGY) is Google DeepMind's agentic coding 10.01 Agent Harness running on workstation mac (30.01 Host Topology MOC). In our multi agent setup (00.02 Architecture Overview MOC), Antigravity is the heavy duty architect, deep researcher, and visual bui...", "outgoing": ["10.01-Agent-Harness", "30.01-Host-Topology-MOC", "00.02-Architecture-Overview-MOC", "40.04-Session-Ingestor", "40.01-Agent-Policy", "40.02-Policy-Sync-Target", "40.03-Agent-Skill", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "10.03-Codex-CLI-and-Spark"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "10.01-Agent-Harness", "10.03-Codex-CLI-and-Spark", "2 e indexed into our searchable archive via [[40.04-Session-Ingestor]].\n\n## Quota Rule of Thumb\n\nIn [[50.02-2026-10-19-Session-Review-and-Quota-Audit]], we found that letting Codex sit in 45-second `sleep` loops waiting on server jobs burned through OpenAI's 5-hour usage limit. Now, long-running multi-file jobs go to [[10.02-Antigravity-AGY]] or local [[10.04-Hermes-Agent]].", "preview": "Codex ( /Applications/ChatGPT.app / ~/.codex/ ) is OpenAI's coding 10.01 Agent Harness. In Erick's setup, it runs Luna (default), Sol / Terra (deep reasoning when explicitly requested), plus fast, disposable Spark checks. Per 40.01 Agent Policy (and 70.01 Inte...", "outgoing": ["10.01-Agent-Harness", "40.01-Agent-Policy", "70.01-Intelligence-Fit-to-Form-MOC", "40.03-Agent-Skill", "40.02-Policy-Sync-Target", "40.04-Session-Ingestor", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "10.02-Antigravity-AGY", "10.04-Hermes-Agent"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.05-OpenCode-and-Maestri", "20.01-Base-Model", "30.01-Host-Topology-MOC", "40.01-Agent-Policy", "40.02-Policy-Sync-Target", "40.03-Agent-Skill", "40.04-Session-Ingestor", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "70.01-Intelligence-Fit-to-Form-MOC", "70.02-Sycophancy-vs-Reflexive-Contrarianism"]}, "10.04-Hermes-Agent": {"slug": "10.04-Hermes-Agent", "id": "10.04", "title": "Hermes Agent — Local Models, MoA Councils & Kanban", "folder": "10-Harnesses-and-Agents", "domain": "harnesses", "type": "harness", "tags": ["harness", "hermes"], "aliases": ["hermes", "hermes agent", "nous hermes", "mac-orchestrator"], "updated": "2026-10-28", "body": "# Hermes Agent — Local Models, MoA Councils & Kanban\n\n## What Role It Plays\n\n**Hermes Agent** (by Nous Research) is our local-first [[10.01-Agent-Harness]] running across `workstation-mac` and `gpu-server` ([[30.01-Host-Topology-MOC]]). Because it -fable5` and `Qwen3.8-27B-Uncensored`\n- **Shared Rules**: Loads [[40.01-Agent-Policy]] via `~/.config/opencode/opencode.jsonc`.\n- **Chat Archive**: 61 past sessions collected by [[40.04-Session-Ingestor]].\n\n---\n\n## 2. Maestri Spatial Canvas (`Maestri.app`)\n\n**Maestri** is a visual workspace that lets us arrange multiple terminal and AI agent panes side-by-side on an infinite canvas (similar to a live digital workbench):\n- **Agent Presets**: Can spawn panes running [[10.03-Codex-CLI-and-Spark]], **OpenCode** (local models), or a standard shell.\n- **Shared Skills**: Automatically reads all 31 playbooks in [[40.03-Agent-Skill]] across `.claude/skills`, `.agents/skills`, `.hermes/skills`, and `.gemini/config/skills`.", "preview": "OpenCode is a clean desktop 10.01 Agent Harness wired straight to our local 20.03 Inference Provider ( oMLX on workstation mac ). It works 100% offline using local Apple Silicon models: Default Coding Brain : gpt oss 20b MXFP4 Q8 (20.01 Base Model) Fast Helper...", "outgoing": ["10.01-Agent-Harness", "20.03-Inference-Provider", "20.01-Base-Model", "40.01-Agent-Policy", "40.04-Session-Ingestor", "10.03-Codex-CLI-and-Spark", "40.03-Agent-Skill"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "10.01-Agent-Harness", "20.01-Base-Model", "20.03-Inference-Provider", "30.01-Host-Topology-MOC", "40.02-Policy-Sync-Target", "40.03-Agent-Skill", "40.04-Session-Ingestor"]}, "20.01-Base-Model": {"slug": "20.01-Base-Model", "id": "20.01", "title": "Base Model (The Raw AI Brains)", "folder": "20-Models-and-Weights", "domain": "models", "type": "concept", "tags": ["taxonomy", "model"], "aliases": ["base model", "foundation model", "model weights", "qwen3.5-9b"], "updated": "2026-10-28", "body": "# Base Model (The Raw AI Brains)\n\n## What It Is in Plain English\n\nA **Base Model** is the raw AI brain file sitting on disk. On its own, it doesn't do anything until an [[20.03-Inference-Provider]] (**oMLX** or **Ollama**) loads it into RAM/VRAM—and we can optionally snap a [[20.02-LoRA-Weight-Adapter]] (\"habit & voice pack\") onto it to improve how it follows instructions.\n\n---\n\n## Which Brains We Run (And Why)\n\nSee [[70.01-Intelligence-Fit-to-Form-MOC]] for how each model fits a specific job:\n\n### 1. Local Models on `workstation-mac` (Served by oMLX)\n\n| Model Name | Speed & Size | What Job It Does |\n|---|---|---|\n| **`Qwen3.5-9B-oQ6e`** / **`hermes-v2-oQ5e`** | ~8–10 GB RAM · **27–52 tok/s** | Main local brain for [[10.04-Hermes-Agent]] (tuned in [[50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis]]) |\n| **`Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic`** | 4-bit MLX · **40–54 tok/s** | Creative, unfiltered voice used in [[10.04-Hermes-Agent]] MoA councils |\n| **`S1-mini-MLX-oQ5e` / `bf16`** | Tiny footprint · **182–300 tok/s** | Ultra-fast background helper for auto-tagging chats and writing titles ([[10.05-OpenCode-and-Maestri]]) |\n| **`gpt-oss-20b-MXFP4-Q8`** | 20B parameters | Default offline coding brain in [[10.05-OpenCode-and-Maestri]] |\n\n### 2. Local Models on `gpu-server` (RTX 4070 12 GB VRAM)\n\n| Model Name | Server | What Job It Does |\n|---|---|---|\n| **`Qwen3.5-9B` (FP16)** | Unsloth / `server_loopback.py` | Base brain used to train and test our custom [[20.02-LoRA-Weight-Adapter]] (`v2` and `v3`) |\n| **`hermes-eserv:v2`** & **`hermes-qwen35-uncensored:9b`** | Ollama | 24/7 server brains for [[10.04-Hermes-Agent]] and MoA council synthesis |\n| **`huihui_ai/qwen2.5-coder-abliterate:7b`** | Ollama | Fast background coding model on `gpu-server` ([[30.02-Homelab-LLM-Orchestration]]) |\n\n### 3. Cloud Models\n\n| Model Family | App ([[10.01-Agent-Harness]]) | What Job It Does |\n|---|---|---|\n| **Gemini 4 / Gemini 3.8** | [[10.02-Antigravity-AGY]] | 1M–2M token planning, visual portals, and multi-file architecture |\n| **GPT-6 (`Luna` / `Sol` / `Terra`) & `Spark`** | [[10.03-Codex-CLI-and-Spark]] | Deep code reviews and 2-minute `spark` second opinions |", "preview": "A Base Model is the raw AI brain file sitting on disk. On its own, it doesn't do anything until an 20.03 Inference Provider ( oMLX or Ollama ) loads it into RAM/VRAM—and we can optionally snap a 20.02 LoRA Weight Adapter (\"habit & voice pack\") onto it to impro...", "outgoing": ["20.03-Inference-Provider", "20.02-LoRA-Weight-Adapter", "70.01-Intelligence-Fit-to-Form-MOC", "10.04-Hermes-Agent", "50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis", "10.05-OpenCode-and-Maestri", "30.02-Homelab-LLM-Orchestration", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "10.01-Agent-Harness", "10.04-Hermes-Agent", "10.05-OpenCode-and-Maestri", "20.02-LoRA-Weight-Adapter", "20.03-Inference-Provider", "30.02-Homelab-LLM-Orchestration", "50.01-Evaluation-Harness", "50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis", "70.01-Intelligence-Fit-to-Form-MOC"]}, "20.02-LoRA-Weight-Adapter": {"slug": "20.02-LoRA-Weight-Adapter", "id": "20.02", "title": "LoRA Weight Adapter (Custom Voice & Habit Packs)", "folder": "20-Models-and-Weights", "domain": "models", "type": "concept", "tags": ["taxonomy", "model", "lora", "fine-tuning"], "aliases": ["lora", "lora adapter", "weight adapter", "model adapter", "qlora", "qwen3.5-9b-hermes-lora-v2", "qwen3.5-9b-hermes-lora-v3"], "updated": "2026-10-28", "body": "# LoRA Weight Adapter (Custom Voice & Habit Packs)\n\n## What It Is in Plain English\n\nInstead of spending thousands of dollars retraining a 9-billion-parameter [[20.01-Base-Model]] from scratch, a **LoRA Weight Adapter** is a small, snap-on **\"habit & voice pack\"** trained on our `gpu-server` (RTX 4070 12 GB VRAM).\n\nThink of the [[20.01-Base-Model]] (`Qwen3.5-9B`) as a smart actor, and the **LoRA Weight Adapter** as their character direction: it teaches the model to stop bad habits (like searching 6 times in a row when a file doesn't exist) while keeping all its general knowledge intact.\n\n> [!IMPORTANT]\n> **Quick Name Check** (see [[00.01-Terminology-Disambiguation-Matrix]]):\n> When we say **\"adapter\"** while talking about GPU training or `v2`/`v3`, we mean this **LoRA Weight Adapter**—not a [[40.02-Policy-Sync-Target]] (`adapters.json`) or a [[40.04-Session-Ingestor]] (`unify_sessions.py`).\n\n---\n\n## Our Trained Adapter Versions (`v2` & `v3`)\n\nTrained on `gpu-server` under `~/model-tuning/`:\n\n| Version | What We Trained It On | What Improved (Real Test Results) |\n|---|---|---|\n| **`qwen3.5-9b-hermes-lora-v2`** | General tool-calling and clean reasoning examples for [[10.04-Hermes-Agent]] | - **+1.82% higher accuracy** across 110 questions (14 academic/coding datasets) vs. unsteered `Qwen3.5-9B`<br/>- **4 out of 5 PASS (80%)** on our `H01–H05` workflow crash tests ([[50.02-2026-10-19-Session-Review-and-Quota-Audit]]) |\n| **`qwen3.5-9b-hermes-lora-v3`** | Adds `hermes_v3_targeted_traces.jsonl` (built by `curate_hermes_v3_traces.py`) | Built specifically to fix 4 real bugs we caught on Oct 19 ([[50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough]]):<br/>1. **Stop Blind Loops (`H05`)**: Stop after 1–2 empty file searches and tell the user.<br/>2. **Clean Tool Tags (`T02`)**: Always close `</tool_call>` tags when calling two tools at once.<br/>3. **Safety Refusal (`H06`)**: Refuse dangerous disk-wipe commands (`rm -rf /`).<br/>4. **Edge-Case Math/Regex (`T14`)**: Double-check tricky version strings (SemVer 2.0) before answering. |\n\n---\n\n## Why This Matters for Ryan + Erick (`v4` Idea)\n\nSee [[70.02-Sycophancy-vs-Reflexive-Contrarianism]]:\n- Right now, `v2` and `v3` fix **mechanical tool habits** (`H05`, `T02`, `H06`, `T14`).\n- Together, we can curate **`v4` conversational posture traces**—teaching the model the exact line between helpful pushback and annoying contrarianism.", "preview": "Instead of spending thousands of dollars retraining a 9 billion parameter 20.01 Base Model from scratch, a LoRA Weight Adapter is a small, snap on \"habit & voice pack\" trained on our gpu server (RTX 4070 12 GB VRAM). Think of the 20.01 Base Model ( Qwen3.5 9B ...", "outgoing": ["20.01-Base-Model", "00.01-Terminology-Disambiguation-Matrix", "40.02-Policy-Sync-Target", "40.04-Session-Ingestor", "10.04-Hermes-Agent", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "70.02-Sycophancy-vs-Reflexive-Contrarianism"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "10.01-Agent-Harness", "10.04-Hermes-Agent", "20.01-Base-Model", "20.03-Inference-Provider", "30.01-Host-Topology-MOC", "30.02-Homelab-LLM-Orchestration", "30.03-EServ-Filesystem-and-Mounts", "30.05-Emac-Filesystem-and-Home-Layout", "30.06-EServ-Docker-Containers-and-Services", "40.02-Policy-Sync-Target", "40.05-TouchID-Redaction-Vault", "50.01-Evaluation-Harness", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "70.01-Intelligence-Fit-to-Form-MOC", "70.02-Sycophancy-vs-Reflexive-Contrarianism", "70.03-Why-Agent-Browsers-Fail-Comet-vs-Harnesses"]}, "20.03-Inference-Provider": {"slug": "20.03-Inference-Provider", "id": "20.03", "title": "Inference Provider (The Local Model Servers)", "folder": "20-Models-and-Weights", "domain": "models", "type": "concept", "tags": ["taxonomy", "model", "omlx", "ollama"], "aliases": ["inference provider", "inference server", "model server", "omlx", "ollama", "server_loopback.py", "lm studio"], "updated": "2026-10-28", "body": "# Inference Provider (The Local Model Servers)\n\n## What It Is in Plain English\n\nAn **Inference Provider** is the background server app that loads a [[20.01-Base-Model]] (plus an optional [[20.02-LoRA-Weight-Adapter]]) into memory and gives our [[10.01-Agent-Harness]] apps a local URL (`/v1/chat/completions`) to talk to.\n\n---\n\n## Our Active Model Servers\n\n| Server Name | Which Machine | What It Does | Connected Apps |\n|---|---|---|---|\n| **oMLX** | `workstation-mac` | Runs Apple Silicon MLX models locally in unified RAM (`Qwen3.5-9B`, `S1-mini`, `Defiant-Fable`). Tuned for high speed in [[50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis]]. | [[10.04-Hermes-Agent]], [[10.05-OpenCode-and-Maestri]] |\n| **Ollama** | `gpu-server` | Runs 24/7 on the RTX 4070 (12 GB VRAM) serving `hermes-eserv:v2`, `hermes-qwen35-uncensored:9b`, and `qwen2.5-coder:7b`. | [[10.04-Hermes-Agent]] (including MoA councils) |\n| **Loopback Eval Server** (`server_loopback.py`) | `gpu-server` | Temporary test server spun up only when running [[50.01-Evaluation-Harness]] crash tests on [[20.02-LoRA-Weight-Adapter]] checkpoints. | [[50.01-Evaluation-Harness]] |\n| **LM Studio (`llmster`)** | Both machines | Backup server for testing downloaded GGUF models on demand ([[30.02-Homelab-LLM-Orchestration]]). | Cursor / Cline / Manual tests |\n\n---\n\n## Two Simple Rules That Save Headaches\n\n1. **Don't Let `oMLX` Look for Ghost Computers**:\n   - When running solo on `workstation-mac`, keep `\"distributed_inference_enabled\": false` in `~/.omlx/settings.json`. Otherwise it wastes time every 5 seconds trying to ping a second Mac that isn't plugged in ([[50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis]]).\n2. **Turn Off the Test Server When Crash Tests Finish**:\n   - After running `server_loopback.py` on `gpu-server`, always shut it down so all 12 GB of RTX 4070 video memory go back to **Ollama** ([[50.02-2026-10-19-Session-Review-and-Quota-Audit]]).", "preview": "An Inference Provider is the background server app that loads a 20.01 Base Model (plus an optional 20.02 LoRA Weight Adapter) into memory and gives our 10.01 Agent Harness apps a local URL ( /v1/chat/completions ) to talk to. Server Name Which Machine What It ...", "outgoing": ["20.01-Base-Model", "20.02-LoRA-Weight-Adapter", "10.01-Agent-Harness", "50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis", "10.04-Hermes-Agent", "10.05-OpenCode-and-Maestri", "50.01-Evaluation-Harness", "30.02-Homelab-LLM-Orchestration", "50.02-2026-10-19-Session-Review-and-Quota-Audit"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "10.01-Agent-Harness", "10.04-Hermes-Agent", "10.05-OpenCode-and-Maestri", "20.01-Base-Model", "30.01-Host-Topology-MOC", "30.02-Homelab-LLM-Orchestration", "40.06-ANE-Hybrid-Inference-and-Retrieval", "50.02-2026-10-19-Session-Review-and-Quota-Audit", "50.04-2026-10-14-Hermes-Living-Research-Register", "50.05-2026-09-26-Hermes-JSON-Double-Encoding-Postmortem", "50.06-2026-09-09-oMLX-Qwen-Throughput-and-Cache-Analysis", "50.07-2026-10-20-ANE-Retrieval-Harness-and-Contention-Audit"]}, "30.01-Host-Topology-MOC": {"slug": "30.01-Host-Topology-MOC", "id": "30.01", "title": "Host Topology MOC (Which Machine Does What)", "folder": "30-Infrastructure-and-Hosts", "domain": "infrastructure", "type": "moc", "tags": ["moc", "infrastructure", "hosts"], "aliases": ["hosts", "workstation-mac", "gpu-server"], "updated": "2026-10-28", "body": "# Host Topology MOC (Which Machine Does What)\n\nPer [[40.01-Agent-Policy]] (`WORKSTYLE.md`), **every machine has a distinct job—agents never confuse files on the laptop with files on the server.**\n\n---\n\n## Our Environments at a Glance\n\n| Machine / Environment | Hardware | Main Job | When Work Goes Here |\n|---|---|---|---|\n| **`workstation-mac` (Local Laptop)** | MacBook Pro (Apple M5 Pro, 20 GPU cores, 24 GB Unified RAM, 1 TB SSD) | Daily driver; runs [[10.02-Antigravity-AGY]], [[10.03-Codex-CLI-and-Spark]], [[10.04-Hermes-Agent]], [[10.05-OpenCode-and-Maestri]], and local [[20.03-Inference-Provider]] **oMLX**. Holds `~/.agents/` and [[40.05-TouchID-Redaction-Vault]]. | Default for desktop apps, code repos (`~/Projects/`), local Apple Silicon models, and orchestrating across agents. |\n| **Git Worktree (on `workstation-mac`)** | Separate Git folder on the laptop | Keeps two coding tasks from stepping on each other's uncommitted files while still sharing the same Mac. | Running two code branches at the same time safely. |\n| **`gpu-server` (24/7 Linux Server)** | Dedicated Desktop Server (Intel CPU + **NVIDIA RTX 4070 12 GB VRAM** + multi-drive NVMe/SATA storage pool) | Runs 24/7 **Ollama** ([[20.03-Inference-Provider]]), trains [[20.02-LoRA-Weight-Adapter]] packs (`v2`/`v3`), runs [[50.01-Evaluation-Harness]] crash tests, and stores the master backup of 794 unified chat sessions. | Heavy GPU fine-tuning, automated benchmark suites (`H01–H06`, `T01–T15`), and background Docker services. |\n| **Cloud Container** | Temporary Linux sandbox in the cloud | Has only a cloned Git repo—zero access to local files, passwords, or our home network. | Isolated repo unit tests and pull request previews. |\n\n---\n\n## Notes in This Folder\n\n- [[30.02-Homelab-LLM-Orchestration]] — How `workstation-mac` and `gpu-server` split AI model workloads.\n- [[30.03-EServ-Filesystem-and-Mounts]] — How we organized drives on `gpu-server` and freed **+236 GB** so model caches never choke the OS disk.\n- [[30.04-Zoom-and-Proxyman-Findings]] — How our Swift Accessibility helper reads app UI lists without stealing window focus.\n- [[30.05-Emac-Filesystem-and-Home-Layout]] — How we cleaned up `workstation-mac` (**+333 GB freed**) and separated `~/Projects/` from `~/Documents/`.\n- [[30.06-EServ-Docker-Containers-and-Services]] — Self-hosted Docker services and auto-recovery on `gpu-server`.", "preview": "Per 40.01 Agent Policy ( WORKSTYLE.md ), every machine has a distinct job—agents never confuse files on the laptop with files on the server. Machine / Environment Hardware Main Job When Work Goes Here workstation mac (Local Laptop) MacBook Pro (Apple M5 Pro, 2...", "outgoing": ["40.01-Agent-Policy", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.04-Hermes-Agent", "10.05-OpenCode-and-Maestri", "20.03-Inference-Provider", "40.05-TouchID-Redaction-Vault", "20.02-LoRA-Weight-Adapter", "50.01-Evaluation-Harness", "30.02-Homelab-LLM-Orchestration", "30.03-EServ-Filesystem-and-Mounts", "30.04-Zoom-and-Proxyman-Findings", "30.05-Emac-Filesystem-and-Home-Layout", "30.06-EServ-Docker-Containers-and-Services"], "backlinks": ["00.00-Home-MOC", "10.02-Antigravity-AGY", "10.04-Hermes-Agent", "30.03-EServ-Filesystem-and-Mounts", "30.06-EServ-Docker-Containers-and-Services", "40.01-Agent-Policy", "40.06-ANE-Hybrid-Inference-and-Retrieval", "70.02-Sycophancy-vs-Reflexive-Contrarianism"]}, "30.02-Homelab-LLM-Orchestration": {"slug": "30.02-Homelab-LLM-Orchestration", "id": "30.02", "title": "Homelab LLM Orchestration (Splitting Work Between Laptop & GPU Server)", "folder": "30-Infrastructure-and-Hosts", "domain": "infrastructure", "type": "runbook", "tags": ["infrastructure", "homelab", "ollama", "lmstudio"], "aliases": ["homelab orchestration", "llm tiers"], "updated": "2026-10-28", "body": "# Homelab LLM Orchestration (Splitting Work Between Laptop & GPU Server)\n\n> [!TIP]\n> **Why Split Across Two Machines?**\n> Running a 9B–20B model on `workstation-mac` is fast and portable, but running heavy batch jobs or training [[20.02-LoRA-Weight-Adapter]] packs at the same time would eat up the laptop's 24 GB RAM. Offloading heavy GPU work to `gpu-server` (RTX 4070 12 GB VRAM) keeps the laptop snappy.\n\n---\n\n## 1. Four Simple Model Tiers\n\n| Tier | When We Use It | Brain ([[20.01-Base-Model]]) | Server ([[20.03-Inference-Provider]]) & Machine |\n|---|---|---|---|\n| **1. Daily Local** | Everyday agent chats, coding, and fast tagging | `Qwen3.5-9B-oQ6e` / `gpt-oss-20b` / `S1-mini` | **oMLX** on `workstation-mac` |\n| **2. Heavy GPU Offload** | Multi-model councils, background jobs, and LoRA crash tests | `Qwen3.5-9B` + [[20.02-LoRA-Weight-Adapter]] (`v2`/`v3`) or `qwen2.5-coder:7b` | **Ollama** or `server_loopback.py` on `gpu-server` |\n| **3. Custom GGUF Testing** | Trying out new community GGUF models | Downloaded per test | **LM Studio (`llmster`)** on `gpu-server` |\n| **4. Quick Local Sandbox** | Lightweight offline prompt experiments | `Qwen 14B` / `8B` | **LM Studio** on `workstation-mac` |\n\n---\n\n## 2. Golden Storage Rule: Never Put Models on a RAM Disk\n\nWhen `gpu-server` boots in Unraid mode (see [[30.03-EServ-Filesystem-and-Mounts]]), its root folder (`rootfs`) is a **16 GB RAM disk**.\n- ✅ **Always store models on physical NVMe cache drives** (`/mnt/cache/appdata/` or `/mnt/tmcache/ollama_models/`).\n- ❌ **Never let Docker or Ollama write model weights into `rootfs`**, or a single 10 GB model download will fill up system RAM and crash the server.", "preview": "Why Split Across Two Machines? Running a 9B–20B model on workstation mac is fast and portable, but running heavy batch jobs or training 20.02 LoRA Weight Adapter packs at the same time would eat up the laptop's 24 GB RAM. Offloading heavy GPU work to gpu serve...", "outgoing": ["20.02-LoRA-Weight-Adapter", "20.01-Base-Model", "20.03-Inference-Provider", "30.03-EServ-Filesystem-and-Mounts"], "backlinks": ["00.00-Home-MOC", "20.01-Base-Model", "20.03-Inference-Provider", "30.01-Host-Topology-MOC"]}, "30.03-EServ-Filesystem-and-Mounts": {"slug": "30.03-EServ-Filesystem-and-Mounts", "id": "30.03", "title": "GPU Server Filesystem & Storage Guardrails (+236 GB Reclaimed)", "folder": "30-Infrastructure-and-Hosts", "domain": "infrastructure", "type": "runbook", "tags": ["infrastructure", "storage", "mcp"], "aliases": ["server storage", "eserv mounts", "metamcp guardrails"], "updated": "2026-10-28", "body": "# GPU Server Filesystem & Storage Guardrails (+236 GB Reclaimed)\n\n## 1. One Physical Server, Two Boot Modes\n\nOur `gpu-server` ([[30.01-Host-Topology-MOC]]) is a dedicated PC with an **NVIDIA RTX 4070 (12 GB VRAM)** and multiple NVMe and SATA drives. Because its Linux OS drive was originally moved over from an older ASUS laptop (`cluster-node`), older scripts sometimes call it `cluster-node` or `cluster-node`—they are the exact same physical machine.\n\n---\n\n## 2. How We Reclaimed +236 GB on Oct 19, 2026\n\nBefore our cleanup, the main OS drive (`/`) was **94–99% full** because duplicate AI model caches were scattered across multiple folders. Here is how we fixed it permanently:\n\n| Drive / Mount | Size | Before Cleanup | After Cleanup | What Lives Here Now |\n|---|---|---|---|---|\n| **OS Root (`/`)** | `223 GB` | `94% full` (only 15 GB free!) | **`40% full` (+113 GB freed)** | Linux OS, Docker engine, `~/model-tuning` [[20.02-LoRA-Weight-Adapter]] scripts, and [[10.04-Hermes-Agent]] runtime. |\n| **Workspace (`/mnt/workspace`)** | `394 GB` | `93% full` | **`62% full` (+123 GB freed)** | Shared HuggingFace cache, active GGUF models, and the master archive of 794 unified chats ([[40.04-Session-Ingestor]]). |\n| **Fast Cache (`/mnt/tmcache`)** | `413 GB` | `82% full` | **`89% full`** | Single unified **Ollama** model store (`23 GB` serving all 8 server models) and `uv` package cache. |\n\n### Three Symlink Tricks That Keep the OS Disk Clean\n1. **One Shared Ollama Folder**: Both system Ollama and appdata Ollama point to a single `/mnt/tmcache/ollama_models` folder—deleting **49 GB** of duplicate model blobs.\n2. **One Shared HuggingFace Cache**: Both user CLI and desktop bot point to `/mnt/workspace/user_caches/huggingface` so models never download twice.\n3. **Wired 2.5 GbE Fast Lane**: Cabled `gpu-server` directly via 2.5 Gbps Ethernet so model transfers run at **~63 MB/s** over local LAN instead of throttling at ~2 MB/s over VPN relays.\n\n---\n\n## 3. Tool Guardrail: Don't Confuse Server Disk with Laptop Disk\n\nWhen an [[10.01-Agent-Harness]] has remote server tools (`MetaMCP`) attached:\n- **Local Laptop Files (`workstation-mac`)**: Always use built-in file tools (`read_file`, `write_file`, `edit_file`).\n- **Remote Server Files (`gpu-server`)**: Only use remote `MetaMCP` filesystem tools when explicitly working on `gpu-server`.", "preview": "Our gpu server (30.01 Host Topology MOC) is a dedicated PC with an NVIDIA RTX 4070 (12 GB VRAM) and multiple NVMe and SATA drives. Because its Linux OS drive was originally moved over from an older ASUS laptop ( cluster-node ), older scripts sometimes call it cluster-node...", "outgoing": ["30.01-Host-Topology-MOC", "20.02-LoRA-Weight-Adapter", "10.04-Hermes-Agent", "40.04-Session-Ingestor", "10.01-Agent-Harness"], "backlinks": ["00.00-Home-MOC", "30.01-Host-Topology-MOC", "30.02-Homelab-LLM-Orchestration", "30.06-EServ-Docker-Containers-and-Services"]}, "30.04-Zoom-and-Proxyman-Findings": {"slug": "30.04-Zoom-and-Proxyman-Findings", "id": "30.04", "title": "macOS Accessibility (AX) UI Reader & Network Diagnostics", "folder": "30-Infrastructure-and-Hosts", "domain": "infrastructure", "type": "runbook", "tags": ["infrastructure", "macos-ax", "automation"], "aliases": ["zoom ax collector", "macos-ax", "proxyman capture"], "updated": "2026-10-28", "body": "# macOS Accessibility (AX) UI Reader & Network Diagnostics\n\n## 1. Reading Desktop App Lists Without Stealing Focus (`zoom-participants-ax.swift`)\n\n> [!TIP]\n> **Why This Is Cool**: Most desktop automation tools click on windows and hijack your mouse/keyboard. Our native Swift helper uses the macOS Accessibility (`ApplicationServices` / `AXUIElement`) API to read UI lists in the background **without ever stealing window focus**.\n\n### How It Works\n1. Finds the running desktop app process (`us.zoom.xos`) and locates its open list panel (`AXOutline`).\n2. Quietly moves the list's scroll value in the background (with zero mouse clicks or window activation), reading each row's label as it scrolls.\n3. Restores the exact original scroll position when finished and outputs a clean, deduplicated list (tested on live 200+ item lists).\n\n---\n\n## 2. Network Traffic Debugging Rules (Proxyman)\n\nWhen inspecting how a desktop app talks to its web APIs:\n- Scope capture strictly to the target app's domains rather than proxying all system traffic.\n- **Privacy Guardrail**: Never commit raw network captures (`.har` or `.proxymanlogv2`) into Git or `~/Documents/` (see [[30.05-Emac-Filesystem-and-Home-Layout]]). Always strip auth headers and session tokens first.", "preview": "Why This Is Cool : Most desktop automation tools click on windows and hijack your mouse/keyboard. Our native Swift helper uses the macOS Accessibility ( ApplicationServices / AXUIElement ) API to read UI lists in the background without ever stealing window foc...", "outgoing": ["30.05-Emac-Filesystem-and-Home-Layout"], "backlinks": ["00.00-Home-MOC", "30.01-Host-Topology-MOC"]}, "30.05-Emac-Filesystem-and-Home-Layout": {"slug": "30.05-Emac-Filesystem-and-Home-Layout", "id": "30.05", "title": "Workstation-Mac Home Folder Layout (+333 GB Reclaimed)", "folder": "30-Infrastructure-and-Hosts", "domain": "infrastructure", "type": "runbook", "tags": ["infrastructure", "filesystem", "layout"], "aliases": ["cluster-node filesystem", "home directory layout", "home folder organization"], "updated": "2026-10-28", "body": "# Workstation-Mac Home Folder Layout (+333 GB Reclaimed)\n\n> [!TIP]\n> **The Golden Rule on `workstation-mac`**: Every file has one home. Code repos go in `~/Projects/`, readable notes go in `~/Documents/`, cold backups go in `~/Archives/`, and AI agents are never allowed to dump scratch folders into the home root (`~`).\n\n---\n\n## 1. Where Everything Lives (`~`)\n\n| Folder | What Belongs Here | What Is Strictly Banned Here |\n|---|---|---|\n| **`~/Projects/`** | **All code repositories**, Swift packages, Python apps, and active dev work (`mlx-whisper-gui`, `MacVoiceLogger`, `VoiceDiarizer`, `no-cost-router`, `hermes`, `WritingPeersFusion`). | Personal docs or cold `.tar.gz` dumps. |\n| **`~/Documents/`** | **Readable documents, notes, and runbooks only** (`Operations/`, `Agent-History/`). | Active git repos, compiled binaries, network dumps (`.har`), or giant `.zip` archives. |\n| **`~/Archives/`** | **Cold storage**, old migration bundles, and diagnostic network captures. | Active code or live configs. |\n| **`~/Storage/`** | Local Apple Silicon MLX & [[20.02-LoRA-Weight-Adapter]] weights (`qwen3.5-9b-hermes-v2-oQ5e`, `bonsai-8b-ternary`). | — |\n| **`~/bin/`** | Personal command-line scripts on `$PATH`. | — |\n| **`~/.agents/`** | This **Johnny.Decimal knowledge vault** (`knowledge/`), 31 shared skills (`skills/`), and unified chat transcripts (`sessions/`). | — |\n\n---\n\n## 2. How We Reclaimed +333 GB on Oct 27, 2026\n\nOur 1 TB laptop SSD had dropped to **only 20 GB free (98% full)**. In one evening pass, we restored **353 GB free (61% used)** by cleaning up five hidden space hogs:\n1. **54 GB of unfinished Git pack files** stuck inside a backup folder.\n2. **40 GB abandoned Google Drive temp upload file** hidden in `~/Library/Application Support/Google/DriveFS/`.\n3. **126 GB of duplicate / oversized local AI models** (unused 35B models and duplicate GGUF files that belonged on `gpu-server`).\n4. **11.4 GB of unused Android tablet emulators** (`~/.android/avd/`).\n5. **Thinned local Time Machine snapshots** so macOS immediately returned the freed blocks to APFS.\n\n---\n\n## 3. The Canary File Guardrail (`.sentinel_HAI_004`)\n\n- In the home folder sits a tiny protected file: `~/.sentinel_HAI_004`.\n- It serves as a tripwire for our [[50.04-2026-10-14-Hermes-Living-Research-Register]] (`HAI-004`) side-effect checks—proving that autonomous agents never touch or delete out-of-scope files in `~`.", "preview": "The Golden Rule on workstation mac : Every file has one home. Code repos go in ~/Projects/ , readable notes go in ~/Documents/ , cold backups go in ~/Archives/ , and AI agents are never allowed to dump scratch folders into the home root ( ~ ). Folder What Belo...", "outgoing": ["20.02-LoRA-Weight-Adapter", "50.04-2026-10-14-Hermes-Living-Research-Register"], "backlinks": ["00.00-Home-MOC", "30.01-Host-Topology-MOC", "30.04-Zoom-and-Proxyman-Findings", "50.04-2026-10-14-Hermes-Living-Research-Register", "70.03-Why-Agent-Browsers-Fail-Comet-vs-Harnesses"]}, "30.06-EServ-Docker-Containers-and-Services": {"slug": "30.06-EServ-Docker-Containers-and-Services", "id": "30.06", "title": "GPU Server Docker Services & Self-Healing Startup", "folder": "30-Infrastructure-and-Hosts", "domain": "infrastructure", "type": "runbook", "tags": ["infrastructure", "docker", "services"], "aliases": ["eserv docker", "eserv services", "webtop docker", "immich docker"], "updated": "2026-10-28", "body": "# GPU Server Docker Services & Self-Healing Startup\n\n> [!TIP]\n> **Summary**: Alongside **Ollama** and [[20.02-LoRA-Weight-Adapter]] training, `gpu-server` ([[30.01-Host-Topology-MOC]]) runs self-hosted Docker stacks for photo search, browser sandboxes, local search, and voice transcription—all mounted off the OS disk so containers never fill up root storage.\n\n---\n\n## 1. Key Self-Hosted AI & Utility Services\n\n| Service | Role in Our Stack | Why We Run It Locally |\n|---|---|---|\n| **Immich + CUDA ML** | Self-hosted photo library with GPU-accelerated face & semantic image search (`pgvector`). | Keeps personal photo indexing 100% private on the RTX 4070 GPU. |\n| **Webtop Browser Sandboxes** | Full Linux desktop + browser accessible in a web tab (`KasmVNC`). | Gives background agents (like weekend job-search automation) an isolated browser that never touches personal Mac browser cookies (see `HAI-002` in [[50.04-2026-10-14-Hermes-Living-Research-Register]]). |\n| **SearXNG** | Self-hosted meta-search engine. | Lets local agents run web searches with zero tracking or per-query API fees. |\n| **Speaches (`faster-whisper`)** | Local speech-to-text API on GPU. | Fast voice transcription for local audio/video workflows. |\n| **Portainer & Arcane** | Web dashboards for inspecting container health and logs. | Quick visual status check without SSHing into the server. |\n\n---\n\n## 2. Storage & Auto-Recovery Rules\n\n1. **Keep Container Data Off the OS Drive**:\n   - All databases, photo libraries, and caches live on `/mnt/workspace/` (see [[30.03-EServ-Filesystem-and-Mounts]]), keeping the 223 GB OS partition at a healthy 40%.\n2. **Self-Healing Boot Script (`eserv-docker-startup.service`)**:\n   - On reboot, a `systemd` service waits until Docker is ready and brings up all core stacks in order automatically.", "preview": "Summary : Alongside Ollama and 20.02 LoRA Weight Adapter training, gpu server (30.01 Host Topology MOC) runs self hosted Docker stacks for photo search, browser sandboxes, local search, and voice transcription—all mounted off the OS disk so containers never fi...", "outgoing": ["20.02-LoRA-Weight-Adapter", "30.01-Host-Topology-MOC", "50.04-2026-10-14-Hermes-Living-Research-Register", "30.03-EServ-Filesystem-and-Mounts"], "backlinks": ["00.00-Home-MOC", "30.01-Host-Topology-MOC", "40.03-Agent-Skill"]}, "40.01-Agent-Policy": {"slug": "40.01-Agent-Policy", "id": "40.01", "title": "Agent Policy (WORKSTYLE.md — Our Single Rulebook)", "folder": "40-Capabilities-and-Policy", "domain": "capabilities", "type": "policy", "tags": ["taxonomy", "policy", "guardrails"], "aliases": ["agent policy", "workstyle", "workstyle.md", "rules", "guardrails"], "updated": "2026-10-28", "body": "# Agent Policy (`WORKSTYLE.md` — Our Single Rulebook)\n\n## What It Is in Plain English\n\n**Agent Policy** (`~/.config/agent-policy/WORKSTYLE.md`) is the **single master rulebook** loaded into every session across every [[10.01-Agent-Harness]]. Instead of maintaining separate rules in 6 different apps, we edit `WORKSTYLE.md` once and run `sync_policy.py` to update all 6 [[40.02-Policy-Sync-Target]] files automatically.\n\nSee [[70.02-Sycophancy-vs-Reflexive-Contrarianism]] for how these rules stop models from lecturing, stalling, or looping.\n\n---\n\n## The 4 Core Rules Inside `WORKSTYLE.md`\n\n### 1. Finish the Job in One Pass (No Micro-Checkpoints)\n- When the goal is clear, investigate, build, wire up, and test the whole solution in one go.\n- **Don't stop after making a list or plan just to ask *\"Should I proceed?\"***\n- Only pause to ask **one focused question** when:\n  - Two choices produce totally different results,\n  - An action is destructive or hard to undo (`H06`), or\n  - A privacy/password gate requires human say-so.\n\n### 2. Four Hard Guardrails Against AI Bugs (Added Oct 19 — [[50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough]])\n- **Stop Blind Search Loops (`H05`)**: If 2 searches in a row come back empty, **stop searching immediately**, list the folders checked, and ask or report cleanly.\n- **Never Run Unapproved Destructive Commands (`H06`)**: Never generate or run `rm -rf /` or disk wipes in any test script or background job.\n- **Close Every Tool Tag (`T02`)**: Every tool call must have valid, properly closed syntax (`<tool_call>...</tool_call>`).\n- **Run the Code to Prove It Works (`T14`)**: Don't just eyeball regexes or edge cases—run an actual test assertion before claiming a fix is done.\n\n### 3. Match the Machine & Model to the Task\n- Keep `workstation-mac`, `gpu-server`, and Cloud containers separate ([[30.01-Host-Topology-MOC]]).\n- Use `Spark` (`codex exec -p spark --ephemeral`) for quick 2-minute side checks while the main agent owns final verification ([[10.03-Codex-CLI-and-Spark]]).\n\n### 4. Speak Plainly & Use the Knowledge Vault\n- Check this vault (`otterlore search \"<query>\"`) before guessing how the machines or tools are wired up ([[00.01-Terminology-Disambiguation-Matrix]]).\n- Lead every answer with the **outcome first**, followed briefly by what changed and how it was verified.", "preview": "Agent Policy ( ~/.config/agent policy/WORKSTYLE.md ) is the single master rulebook loaded into every session across every 10.01 Agent Harness. Instead of maintaining separate rules in 6 different apps, we edit WORKSTYLE.md once and run sync policy.py to update...", "outgoing": ["10.01-Agent-Harness", "40.02-Policy-Sync-Target", "70.02-Sycophancy-vs-Reflexive-Contrarianism", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "30.01-Host-Topology-MOC", "10.03-Codex-CLI-and-Spark", "00.01-Terminology-Disambiguation-Matrix"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.05-OpenCode-and-Maestri", "30.01-Host-Topology-MOC", "40.02-Policy-Sync-Target", "40.03-Agent-Skill", "50.01-Evaluation-Harness", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "70.01-Intelligence-Fit-to-Form-MOC", "70.02-Sycophancy-vs-Reflexive-Contrarianism", "70.03-Why-Agent-Browsers-Fail-Comet-vs-Harnesses"]}, "40.02-Policy-Sync-Target": {"slug": "40.02-Policy-Sync-Target", "id": "40.02", "title": "Policy Sync Target (Keeping 6 AI Apps on the Same Page)", "folder": "40-Capabilities-and-Policy", "domain": "capabilities", "type": "concept", "tags": ["taxonomy", "policy", "disambiguation"], "aliases": ["policy sync target", "policy adapter", "adapters.json", "sync_policy.py", "soul.md", "agents.md"], "updated": "2026-10-28", "body": "# Policy Sync Target (Keeping 6 AI Apps on the Same Page)\n\n## What It Is in Plain English\n\nEvery [[10.01-Agent-Harness]] looks for its system rules in a different file (`AGENTS.md`, `SOUL.md`, `CLAUDE.md`, etc.). A **Policy Sync Target** is one of those destination files.\n\nWhenever we edit our master rulebook ([[40.01-Agent-Policy]] / `WORKSTYLE.md`), running `sync_policy.py` stamps the exact same rules block into all 6 apps and checks its SHA-256 fingerprint so zero apps ever drift out of date.\n\n> [!IMPORTANT]\n> **Quick Name Check** (see [[00.01-Terminology-Disambiguation-Matrix]]):\n> Because the config file is named `adapters.json`, it's easy to confuse a **Policy Sync Target** with a [[20.02-LoRA-Weight-Adapter]] (GPU model weights) or a [[40.04-Session-Ingestor]] (chat log parser).\n\n---\n\n## The 6 Files Kept in Sync Automatically\n\n| # | Destination File | Which AI App Reads It ([[10.01-Agent-Harness]]) | How It's Stamped |\n|---|---|---|---|\n| 1 | `~/.codex/AGENTS.md` | [[10.03-Codex-CLI-and-Spark]] | Added at top (`prepend`) |\n| 2 | `~/.hermes/SOUL.md` | [[10.04-Hermes-Agent]] (Default Profile) | Added at bottom (`append`) |\n| 3 | `~/.hermes/profiles/mac-orchestrator/SOUL.md` | [[10.04-Hermes-Agent]] (`mac-orchestrator`) | Added at bottom (`append`) |\n| 4 | `~/.gemini/config/rules/AGENTS.md` | [[10.02-Antigravity-AGY]] | Added at top (`prepend`) |\n| 5 | `~/.agents/rules/autonomy.md` | Shared `~/.agents` rule | Added at bottom (`append`) |\n| 6 | `~/.config/opencode/opencode.jsonc` & `~/.claude/CLAUDE.md` | [[10.05-OpenCode-and-Maestri]] & Claude Code | Linked via instructions path |\n\n---\n\n## One-Line Sync & Drift Check\n\n```bash\n# Stamp WORKSTYLE.md into all 6 targets:\npython3 ~/.config/agent-policy/sync_policy.py\n\n# Check if any file drifted out of sync (returns {\"adapters\": 6, \"drift\": []}):\npython3 ~/.config/agent-policy/sync_policy.py --check\n```", "preview": "Every 10.01 Agent Harness looks for its system rules in a different file ( AGENTS.md , SOUL.md , CLAUDE.md , etc.). A Policy Sync Target is one of those destination files. Whenever we edit our master rulebook (40.01 Agent Policy / WORKSTYLE.md ), running sync ...", "outgoing": ["10.01-Agent-Harness", "40.01-Agent-Policy", "00.01-Terminology-Disambiguation-Matrix", "20.02-LoRA-Weight-Adapter", "40.04-Session-Ingestor", "10.03-Codex-CLI-and-Spark", "10.04-Hermes-Agent", "10.02-Antigravity-AGY", "10.05-OpenCode-and-Maestri"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.04-Hermes-Agent", "20.02-LoRA-Weight-Adapter", "40.01-Agent-Policy", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "70.01-Intelligence-Fit-to-Form-MOC", "70.02-Sycophancy-vs-Reflexive-Contrarianism"]}, "40.03-Agent-Skill": {"slug": "40.03-Agent-Skill", "id": "40.03", "title": "Agent Skill (31 Shared How-To Playbooks)", "folder": "40-Capabilities-and-Policy", "domain": "capabilities", "type": "concept", "tags": ["taxonomy", "skill", "capabilities"], "aliases": ["skill", "agent skill", "skill.md", "skills catalog"], "updated": "2026-10-28", "body": "# Agent Skill (31 Shared How-To Playbooks)\n\n## What It Is in Plain English\n\nIf [[40.01-Agent-Policy]] (`WORKSTYLE.md`) is the **always-on house rules**, an **Agent Skill** (`SKILL.md`) is an **on-demand recipe book**.\n\nWe keep **31 shared skills** in `~/.agents/skills/` and symlink them into [[10.02-Antigravity-AGY]], [[10.03-Codex-CLI-and-Spark]], [[10.04-Hermes-Agent]], and [[10.05-OpenCode-and-Maestri]]. That way, an agent doesn't waste context window tokens reading 31 playbooks on every turn—it only opens the one `SKILL.md` file it needs when you ask for that specific task.\n\n---\n\n## Highlights from Our 31 Shared Skills\n\n| Skill Name | What It Teaches the Agent to Do |\n|---|---|\n| **`otterlore`** & **`knowledge-vault`** | Search this `[[wikilink]]` vault and 794 past chats in under 80ms via [[40.06-ANE-Hybrid-Inference-and-Retrieval]]. |\n| **`homelab-ops`** | Safely inspect and manage `gpu-server`, Docker stacks ([[30.06-EServ-Docker-Containers-and-Services]]), and local **oMLX** settings. |\n| **`imessage-export`** | Export a single Apple Messages thread to verified JSON without touching any other chats ([[40.07-iMessage-Thread-Export]]). |\n| **`review` / `review-bugbot` / `review-security`** | Run a strict, defect-first code or security audit before merging changes. |\n| **`zed-omlx-models`** | Wire up local Apple Silicon models in the Zed code editor. |\n| **`create-skill` / `create-rule` / `create-subagent`** | Package a solved workflow into a new reusable `SKILL.md` so we never have to explain it twice. |", "preview": "If 40.01 Agent Policy ( WORKSTYLE.md ) is the always on house rules , an Agent Skill ( SKILL.md ) is an on demand recipe book . We keep 31 shared skills in ~/.agents/skills/ and symlink them into 10.02 Antigravity AGY, 10.03 Codex CLI and Spark, 10.04 Hermes A...", "outgoing": ["40.01-Agent-Policy", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.04-Hermes-Agent", "10.05-OpenCode-and-Maestri", "40.06-ANE-Hybrid-Inference-and-Retrieval", "30.06-EServ-Docker-Containers-and-Services", "40.07-iMessage-Thread-Export"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.05-OpenCode-and-Maestri", "40.07-iMessage-Thread-Export", "70.01-Intelligence-Fit-to-Form-MOC"]}, "40.04-Session-Ingestor": {"slug": "40.04-Session-Ingestor", "id": "40.04", "title": "Session Ingestor (Unifying 794 Chats Across 9 AI Apps)", "folder": "40-Capabilities-and-Policy", "domain": "capabilities", "type": "concept", "tags": ["taxonomy", "sessions", "history"], "aliases": ["session ingestor", "session adapter", "unify_sessions.py", "agent-history", "specstory"], "updated": "2026-10-28", "body": "# Session Ingestor (Unifying 794 Chats Across 9 AI Apps)\n\n## What It Is in Plain English\n\nWhen you jump between [[10.03-Codex-CLI-and-Spark]], [[10.04-Hermes-Agent]], [[10.02-Antigravity-AGY]], and [[10.05-OpenCode-and-Maestri]], your good ideas get trapped inside 9 different app folders.\n\nOur **Session Ingestor** (`~/.agents/scripts/unify_sessions.py`) reads every app's native chat log, strips out any API keys into [[40.05-TouchID-Redaction-Vault]], removes duplicates, and saves all **794 conversations** into one clean, searchable archive (`~/.agents/sessions/`, backed up hourly to `gpu-server`).\n\n---\n\n## 1. Where the 794 Saved Sessions Come From\n\n1. **[[10.03-Codex-CLI-and-Spark]]**: `394` chats\n2. **[[10.04-Hermes-Agent]]**: `173` JSON logs (+ `486` SQLite `state.db` chats)\n3. **SpecStory**: `68` project histories\n4. **[[10.05-OpenCode-and-Maestri]]**: `61` chats\n5. **[[10.02-Antigravity-AGY]]**: `56` brain transcripts\n6. **Cursor / Gemini CLI / Claude Code**: `42` combined chats\n\n---\n\n## 2. How Background Auto-Tagging Works (`tag_hermes_sessions.py`)\n\nTo make hundreds of past chats easy to browse without burning cloud tokens, `tag_hermes_sessions.py` summarizes and tags each chat locally:\n1. Opens `state.db` in **read-only mode** and scrubs out secrets first.\n2. Uses **Apple Intelligence (`FoundationModels` on the Mac's Neural Engine)** via `AppleTagger.swift` to generate a 1-sentence summary and 3–6 topic tags in ~2 seconds per chat—using **zero RAM from oMLX** (see [[40.06-ANE-Hybrid-Inference-and-Retrieval]]).\n3. Links matching tags straight to notes in this `[[wikilink]]` vault!", "preview": "When you jump between 10.03 Codex CLI and Spark, 10.04 Hermes Agent, 10.02 Antigravity AGY, and 10.05 OpenCode and Maestri, your good ideas get trapped inside 9 different app folders. Our Session Ingestor ( ~/.agents/scripts/unify sessions.py ) reads every app...", "outgoing": ["10.03-Codex-CLI-and-Spark", "10.04-Hermes-Agent", "10.02-Antigravity-AGY", "10.05-OpenCode-and-Maestri", "40.05-TouchID-Redaction-Vault", "40.06-ANE-Hybrid-Inference-and-Retrieval"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "10.01-Agent-Harness", "10.02-Antigravity-AGY", "10.03-Codex-CLI-and-Spark", "10.05-OpenCode-and-Maestri", "20.02-LoRA-Weight-Adapter", "30.03-EServ-Filesystem-and-Mounts", "40.02-Policy-Sync-Target", "40.05-TouchID-Redaction-Vault", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough", "70.01-Intelligence-Fit-to-Form-MOC"]}, "40.05-TouchID-Redaction-Vault": {"slug": "40.05-TouchID-Redaction-Vault", "id": "40.05", "title": "TouchID Redaction Vault (657 Keys Locked in macOS Keychain)", "folder": "40-Capabilities-and-Policy", "domain": "capabilities", "type": "concept", "tags": ["security", "keychain", "redaction"], "aliases": ["redaction vault", "touchid vault", "vault.py", "agentredactedvault"], "updated": "2026-10-28", "body": "# TouchID Redaction Vault (657 Keys Locked in macOS Keychain)\n\n## What It Is in Plain English\n\nWhen you're debugging with an AI, it's easy for an API key, password, or token to end up in a chat log. If you just delete the key when cleaning logs, you might lose a token you actually needed; if you leave it in the log, you can't safely use your chats for search or [[20.02-LoRA-Weight-Adapter]] fine-tuning.\n\nOur script (`~/.agents/scripts/vault.py`) solves both problems at once:\n1. Whenever [[40.04-Session-Ingestor]] spots a secret in any chat log, it replaces the secret in the text with a clean placeholder: `[REDACTED: <label>]`.\n2. Before erasing it from the text, `vault.py` saves the real key inside the **native macOS Keychain (`Passwords.app`)** under **`AgentRedactedVault`**, locked behind your fingerprint (**TouchID**).\n\n- **Total Keys Rescued & Locked**: **657 unique credentials** safely stripped from chat logs and stored in macOS Keychain.", "preview": "When you're debugging with an AI, it's easy for an API key, password, or token to end up in a chat log. If you just delete the key when cleaning logs, you might lose a token you actually needed; if you leave it in the log, you can't safely use your chats for s...", "outgoing": ["20.02-LoRA-Weight-Adapter", "40.04-Session-Ingestor"], "backlinks": ["00.00-Home-MOC", "00.01-Terminology-Disambiguation-Matrix", "00.02-Architecture-Overview-MOC", "30.01-Host-Topology-MOC", "40.04-Session-Ingestor", "50.03-2026-10-19-Tri-Agent-Hardening-Plan-and-Walkthrough"]}, "40.06-ANE-Hybrid-Inference-and-Retrieval": {"slug": "40.06-ANE-Hybrid-Inference-and-Retrieval", "id": "40.06", "title": "Apple Neural Engine (ANE) Hybrid Search (Sub-80ms Local Memory)", "folder": "40-Capabilities-and-Policy", "domain": "capabilities", "type": "concept", "tags": ["capabilities", "ane", "search", "retrieval"], "aliases": ["ane search", "ane-search", "core ml hybrid", "otterlore search"], "updated": "2026-10-28", "body": "# Apple Neural Engine (ANE) Hybrid Search (Sub-80ms Local Memory)\n\n## What It Is in Plain English\n\nWhen an agent searches this vault (`~/.agents/knowledge/`) or our 794 past chats (`~/.agents/sessions/`), we don't want it to wake up a giant 10 GB model or wait on a slow cloud API.\n\nInstead, we built **`ane-search`** in native Swift (`ANESearch.swift`) on `workstation-mac` ([[30.01-Host-Topology-MOC]]). It uses Apple's built-in system frameworks (`NaturalLanguage.framework` + `Accelerate` hardware math) to search **1,290 note chunks in under 80 milliseconds**—while leaving **oMLX** ([[20.03-Inference-Provider]]) 100% free for chatting.\n\n```mermaid\nflowchart TD\n    subgraph VaultData [\"Our Local Memory\"]\n        KNOW[\"🧠 Knowledge Vault<br/>(Notes & [[Wikilinks]])\"]\n        SESS[\"🗂️ 794 Unified Chats<br/>(Secret-Scrubbed)\"]\n    end\n\n    subgraph FastSearch [\"Sub-80ms Local Search (workstation-mac)\"]\n        BM25[\"🔤 Exact Word Match (BM25)<br/>(0.85 ms)\"]\n        ANE[\"🧭 Meaning / Concept Match (ane-search)<br/>(78 ms via Apple NaturalLanguage)\"]\n        RRF[\"⚡ Combined Hybrid Ranking (RRF)\"]\n    end\n\n    KNOW --> BM25\n    KNOW --> ANE\n    SESS --> BM25\n    SESS --> ANE\n    BM25 --> RRF\n    ANE --> RRF\n```\n\n---\n\n## Why We Combine Word Search (BM25) + Meaning Search (`ane-search`)\n\nIn our Oct 20 benchmark audit ([[50.07-2026-10-20-ANE-Retrieval-Harness-and-Contention-Audit]]), we tested 25 real questions:\n- **Exact Word Match (BM25)** scored **85% accuracy** (100% when searching exact names like `TouchID` or `SemVer 2.0`), taking less than **1 millisecond**.\n- **Pure Meaning/Vector Search (`ane-search`)** alone only scored **40%** because vector embeddings often blur exact technical code names.\n- **Hybrid Search (combining both)** gives us the best of both worlds: exact code names always match, AND paraphrased questions still find the right note (see [[70.03-Why-Agent-Br
